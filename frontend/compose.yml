services:
  frontend:
    container_name: frontend
    restart: unless-stopped

    build:
      context: https://github.com/GetJobAI/frontend.git#main
      dockerfile: Dockerfile

    environment:
      - DATABASE_URL=${FRONTEND_DB_URL}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_NEXT_JS_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - WIZARD_ENCRYPTION_KEY=${FRONTEND_WIZARD_SECRET_KEY}

    networks:
      - proxy_network
