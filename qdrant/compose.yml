services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    restart: unless-stopped
    pull_policy: always

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"HTTP/1.1 200\" <&3' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    volumes:
      - qdrant_data:/qdrant/storage

    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}

    networks:
      - proxy_network

volumes:
  qdrant_data:
