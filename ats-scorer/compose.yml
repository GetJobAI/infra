services:
  ats-scorer-model-init:
    container_name: ats-scorer-model-init
    restart: "no"
    image: ghcr.io/getjobai/ats-scorer:latest
    build:
      context: https://github.com/GetJobAI/ats-scorer.git#main
      dockerfile: Dockerfile
    command: ["download-models"]
    volumes:
      - fastembed_models:/app/.fastembed_cache

  ats-scorer:
    container_name: ats-scorer
    restart: unless-stopped
    pull_policy: always
    init: true

    depends_on:
      ats-scorer-model-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    image: ghcr.io/getjobai/ats-scorer:latest
    build:
      context: https://github.com/GetJobAI/ats-scorer.git#main
      dockerfile: Dockerfile

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      - POSTGRES_URL=postgres://postgres:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - QDRANT_URL=http://qdrant:6334
      - QDRANT_COLLECTION=document_vectors
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2f
      - RABBITMQ_CONSUME_EXCHANGE=db_events_exchange
      - RABBITMQ_CONSUME_ROUTING_KEY=ats_score_requests.insert
      - RABBITMQ_CONSUME_QUEUE=ats.score.requests
      - RABBITMQ_PUBLISH_EXCHANGE=resume.scored
      - TFIDF_TOP_K=20
      - RERANKER_TOP_K=5
      - EMBEDDING_BATCH_SIZE=32
      - RUST_LOG=info,ats_scorer=debug

    volumes:
      - fastembed_models:/app/.fastembed_cache

    networks:
      - proxy_network

volumes:
  fastembed_models:
