services:
  ai-optimizer:
    container_name: ai-optimizer
    restart: unless-stopped
    pull_policy: always

    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    image: ghcr.io/getjobai/ai-optimizer:latest
    build:
      context: https://github.com/GetJobAI/ai-optimizer.git#main
      dockerfile: Dockerfile

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}"
      RabbitMq__Host: "rabbitmq://rabbitmq"
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Gemini__ApiKey: ${GEMINI_API_KEY}
      Gemini__PrimaryModel: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}

    networks:
      - proxy_network