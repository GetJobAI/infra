services:
  vectoriser-model-init:
    container_name: vectoriser-model-init
    restart: "no"
    image: ghcr.io/getjobai/vectoriser:latest
    build:
      context: https://github.com/GetJobAI/vectoriser.git#main
      dockerfile: Dockerfile
    command: ["download-model"]
    volumes:
      - fastembed_models:/app/.fastembed_cache

  vectoriser:
    container_name: vectoriser
    restart: unless-stopped
    pull_policy: always
    init: true

    depends_on:
      vectoriser-model-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    image: ghcr.io/getjobai/vectoriser:latest
    build:
      context: https://github.com/GetJobAI/vectoriser.git#main
      dockerfile: Dockerfile

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

    environment:
      - POSTGRES_URL=postgres://postgres:${DB_PASSWORD}@db:5432/${DB_NAME}?sslmode=disable
      - QDRANT_URL=http://qdrant:6334
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=document_vectors
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/%2f
      - RABBITMQ_CONSUME_EXCHANGE=resume.events
      - RABBITMQ_CONSUME_ROUTING_KEY=resume.parsing.completed
      - RABBITMQ_CONSUME_QUEUE=resume.parsing.completed.queue
      - RABBITMQ_PUBLISH_EXCHANGE=document.events
      - RABBITMQ_PUBLISH_ROUTING_KEY=vectors.ready
      - RABBITMQ_DB_EVENTS_EXCHANGE=db_events_exchange
      - RABBITMQ_DB_EVENTS_QUEUE=vectoriser.db.events
      - EMBEDDING_BATCH_SIZE=32
      - RUST_LOG=info,vectoriser=debug

    volumes:
      - fastembed_models:/app/.fastembed_cache

    networks:
      - proxy_network

volumes:
  fastembed_models:
